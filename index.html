<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=20261006" />
    <link rel="icon" href="/favicon.ico?v=20261006" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06152e" />

    <title>Saarthi — Your co-pilot for safer drives</title>
    <meta
      name="description"
      content="Saarthi turns a compatible phone into a driver-safety co-pilot, with alerts for signs of fatigue and distraction. Built for supported iPhones and Android phones."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Saarthi — Your co-pilot for safer drives" />
    <meta
      property="og:description"
      content="Real-time driver safety, right from your phone. No extra hardware. iOS and Android."
    />
    <meta property="og:image" content="https://saarthi-website-zeta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saarthi Telematics — Driver &amp; Road Monitoring System" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent a flash of the wrong theme before React mounts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('saarthi-theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : systemDark
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
